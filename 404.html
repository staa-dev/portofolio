<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Redirect...</title></head>
<body>
<script>
// Ambil path dari URL: staaporto.my.id/kode123
const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
// Redirect ke short.html dengan parameter
if (path && path !== 'index.html' && path !== 'short.html' && path !== '404.html') {
    window.location.href = '/short.html?r=' + encodeURIComponent(path);
} else {
    window.location.href = '/index.html';
}
</script>
</body>
</html>
